[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localvision"
version = "0.1.0"
description = "Interactive community-data dashboards in Jupyter — a Python wrapper around the LocalVision JS library."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mac Faldet", email = "MacFaldet@focaldataworks.com" },
]
keywords = ["geo", "choropleth", "census", "acs", "jupyter", "widget", "dataviz"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "anywidget>=0.9",
    "traitlets>=5.0",
    "pandas>=1.5",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "jupyterlab",
    "ruff",
    "pytest",
]

[project.urls]
Homepage = "https://github.com/mfaldet/localvision"
Repository = "https://github.com/mfaldet/localvision"
Issues = "https://github.com/mfaldet/localvision/issues"

[tool.hatch.build.targets.wheel]
packages = ["localvision_py"]

[tool.hatch.build.targets.wheel.shared-data]
"localvision_py/static/widget.js" = "share/jupyter/labextensions/localvision/static/widget.js"
