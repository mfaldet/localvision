<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LocalVision — ACS Data Binding (Minnesota)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0F1117; font-family: 'Inter', sans-serif; color: #F0F2FF; }

    #app { width: 100%; height: 100vh; }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0F1117;
      z-index: 999;
      gap: 16px;
      font-size: 14px;
      color: #8B92B4;
    }
    #loading .spinner {
      width: 32px; height: 32px;
      border: 3px solid #2D3148;
      border-top-color: #3B82F6;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    #loading.hidden { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #error {
      position: fixed;
      top: 16px; left: 50%;
      transform: translateX(-50%);
      background: #1A1D27;
      border: 1px solid #ef4444;
      border-radius: 8px;
      padding: 16px 24px;
      max-width: 560px;
      font-size: 13px;
      color: #fca5a5;
      z-index: 1000;
      display: none;
    }
    #error.visible { display: block; }
    #error code { background: #0F1117; padding: 2px 6px; border-radius: 4px; color: #F0F2FF; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div id="loading-msg">Fetching Minnesota county boundaries…</div>
  </div>
  <div id="error"></div>
  <div id="app"></div>

  <script type="module">
    import {
      LocalVisionApp,
      BoundaryLoader,
      CensusACS,
      bindDataToBoundaries,
    } from '../src/index.ts'

    const setLoading = (msg) => {
      const el = document.getElementById('loading-msg')
      if (el) el.textContent = msg
    }
    const hideLoading = () => document.getElementById('loading').classList.add('hidden')
    const showError = (html) => {
      const el = document.getElementById('error')
      el.innerHTML = html
      el.classList.add('visible')
      hideLoading()
    }

    try {
      const loader = new BoundaryLoader({ persistentCache: true })
      const acs = new CensusACS({
        apiKey: import.meta.env.VITE_CENSUS_API_KEY, // paste into .env.local
        sessionCache: true,
      })

      // ACS variables fetched at every drill level (BYO metric — these are
      // just demo data; the library itself doesn't bake in ACS).
      const VARIABLES = [
        'median_household_income',
        'total_population',
        'median_gross_rent',
        'median_home_value',
        'per_capita_income',
      ]
      // ACS 5-year vintages — drives the time slider
      const YEARS = [2018, 2019, 2020, 2021, 2022]

      hideLoading()

      // City-first mode: no initial binding. The app starts blank with just
      // a city-search box. After the user picks a city, drillProvider fires
      // for the default level (State) and the view boots up.
      const app = new LocalVisionApp({
        container: '#app',
        // Inner City is the default — see the chosen city's tracts up close
        defaultView: 'inner',
        // Comparison level for Outer City — peer counties in the same state
        defaultOuterBoundary: 'county',
        defaultInnerBoundary: 'tract',
        drillProvider: async ({ level, parent, context }) => {
          console.log(`[drill] → ${level} for ${parent.label}`)
          const stateFips = context.stateFips ?? '27'

          // Note: 'state' is no longer an Outer level. Every fetch is
          // scoped to the selected city's state.
          let boundariesPromise
          switch (level) {
            case 'county': boundariesPromise = loader.counties(stateFips); break
            case 'place':  boundariesPromise = loader.places(stateFips); break
            case 'cousub': boundariesPromise = loader.countySubdivisions(stateFips); break
            case 'tract':  boundariesPromise = loader.tracts(stateFips, context.countyFips); break
            case 'bg':     boundariesPromise = loader.blockGroups(stateFips, context.countyFips); break
            default:
              console.warn(`[drill] no provider for level: ${level}`)
              return null
          }

          // Every ACS fetch is scoped to the selected city's state.
          // tract / bg additionally narrow to the city's containing county.
          const tablePromise = acs.fetchTemporal({
            variables: VARIABLES,
            geography: { state: stateFips, level, county: context.countyFips },
            years: YEARS,
          })

          const [b, t] = await Promise.all([boundariesPromise, tablePromise])
          return bindDataToBoundaries(b, t)
        },
        // Outer view stub — no initial binding (city-first); activeKpi just
        // names the metric that should drive the choropleth on first paint.
        outer: { activeKpi: 'median_household_income' },
      })

      app.selectionStore.subscribe((state) => {
        console.log('[selection]', [...state.selected])
      })
    } catch (err) {
      console.error(err)
      const isKeyError = String(err.message).includes('key') || String(err.message).includes('400')
      showError(`
        <strong>Failed to load.</strong><br><br>
        ${err.message}<br><br>
        ${isKeyError ? `Likely missing API key. Create <code>.env.local</code> in the project root with:<br>
        <code>VITE_CENSUS_API_KEY=your_key_here</code><br>
        then restart the dev server.` : ''}
      `)
    }
  </script>
</body>
</html>
